name: Deploy

# Builds the container image, then applies Terraform with that image's tag.

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - development
          - production
      commit_sha:
        description: Commit to deploy (blank = tip of the selected branch)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || '' }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROVIDER_NAME }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker --quiet

      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REPO="gcr.io/${{ vars.PROJECT_ID }}/mod-notification-handler"

          # Best-effort cache source; the first build in a fresh project has none.
          docker pull "$REPO:latest" || true

          docker build \
            --cache-from "$REPO:latest" \
            -t "$REPO:$SHA" \
            -t "$REPO:latest" \
            -f cicd/Dockerfile .

          docker push --all-tags "$REPO"

          echo "image=$REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "Built $REPO:$SHA"

  apply:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}

    env:
      TF_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || '' }}

      - name: Report what is being applied
        run: |
          echo "Environment: $TF_ENVIRONMENT"
          echo "Commit:      $(git rev-parse HEAD)"
          echo "Image:       ${{ needs.build.outputs.image }}"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('cicd/terraform/.terraform.lock.hcl') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROVIDER_NAME }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_BUCKET }}"
        working-directory: cicd/terraform

      - name: Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="envs/${TF_ENVIRONMENT}.tfvars" \
            -var="image=${{ needs.build.outputs.image }}"
        working-directory: cicd/terraform
