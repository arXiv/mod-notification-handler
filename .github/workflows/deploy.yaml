name: Deploy

# Builds the container image, then applies Terraform with that image's tag.

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - development
          - production
      commit_sha:
        description: Commit to deploy (blank = tip of the selected branch)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the target environment 
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      branch: ${{ steps.pick.outputs.branch }}

    steps:
      - name: Map trigger to environment
        id: pick
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_ENVIRONMENT:-$REF_NAME}"

          case "$TARGET" in
            production|main)     ENVIRONMENT=production;  BRANCH=main ;;
            development|develop) ENVIRONMENT=development; BRANCH=develop ;;
            *) echo "::error::no environment mapped for '$TARGET'"; exit 1 ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Deploying to $ENVIRONMENT, from $BRANCH"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.environment }}

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 50   # the guard below needs history to walk

      # commit_sha accepts any commit in the repo, so check it actually landed on
      # the branch this environment deploys. Ancestors pass, which keeps rollbacks
      # to an older commit working; unmerged branches do not.
      - name: Verify commit is on the environment's branch
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=50 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          if ! git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            echo "::error::$(git rev-parse HEAD) is not among the last 50 commits of $BRANCH; refusing to deploy"
            exit 1
          fi
          echo "$(git rev-parse HEAD) is on $BRANCH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROVIDER_NAME }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker --quiet

      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REPO="gcr.io/${{ vars.PROJECT_ID }}/mod-notification-handler"

          # Best-effort cache source; the first build in a fresh project has none.
          docker pull "$REPO:latest" || true

          docker build \
            --cache-from "$REPO:latest" \
            -t "$REPO:$SHA" \
            -t "$REPO:latest" \
            -f cicd/Dockerfile .

          docker push --all-tags "$REPO"

          echo "image=$REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "Built $REPO:$SHA"

  apply:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.environment }}

    env:
      TF_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Report what is being applied
        run: |
          echo "Environment: $TF_ENVIRONMENT"
          echo "Commit:      $(git rev-parse HEAD)"
          echo "Image:       ${{ needs.build.outputs.image }}"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('cicd/terraform/.terraform.lock.hcl') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROVIDER_NAME }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_BUCKET }}"
        working-directory: cicd/terraform

      - name: Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="envs/${TF_ENVIRONMENT}.tfvars" \
            -var="image=${{ needs.build.outputs.image }}"
        working-directory: cicd/terraform
